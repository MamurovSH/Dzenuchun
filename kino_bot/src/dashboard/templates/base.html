<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kino Bot Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .sidebar { background: #1e293b; min-height: 100vh; width: 240px; position: fixed; top: 0; left: 0; padding: 1.5rem 1rem; }
    .main-content { margin-left: 240px; padding: 2rem; }
    .stat-card { background: #1e293b; border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
    .stat-card .number { font-size: 2rem; font-weight: 700; color: #38bdf8; }
    .sidebar .nav-link { color: #94a3b8; border-radius: 8px; margin: 2px 0; padding: 0.6rem 1rem; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #334155; color: #f8fafc; }
    .sidebar .brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 2rem; padding: 0 0.5rem; }
    .table-dark { --bs-table-bg: #1e293b; }
    .badge-role { font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">🎬 Kino Bot</div>
    <nav class="nav flex-column">
      <a class="nav-link" href="/dashboard/"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a class="nav-link" href="/dashboard/movies"><i class="bi bi-film me-2"></i>Movies</a>
      <a class="nav-link" href="/dashboard/users"><i class="bi bi-people me-2"></i>Users</a>
      <a class="nav-link" href="/docs"><i class="bi bi-code-slash me-2"></i>API Docs</a>
      <a class="nav-link text-danger mt-auto" href="/dashboard/logout"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
    </nav>
  </div>
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
