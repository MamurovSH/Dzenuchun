<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Kino Bot Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #1e293b; border-radius: 16px; padding: 2.5rem; width: 380px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 class="mb-1 text-center">🎬 Kino Bot</h2>
    <p class="text-center text-secondary mb-4">Admin Dashboard</p>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/dashboard/login">
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
</body>
</html>
