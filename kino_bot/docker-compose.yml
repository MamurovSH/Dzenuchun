version: "3.9"

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kino_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kino
      POSTGRES_PASSWORD: kinopass
      POSTGRES_DB: kinodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kino -d kinodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kino_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Telegram Bot ──────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino_bot
    restart: unless-stopped
    command: python main.py bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kino:kinopass@postgres:5432/kinodb
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  # ── REST API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino_api
    restart: unless-stopped
    command: python main.py api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kino:kinopass@postgres:5432/kinodb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Admin Dashboard ───────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino_dashboard
    restart: unless-stopped
    command: python main.py dashboard
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kino:kinopass@postgres:5432/kinodb
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
